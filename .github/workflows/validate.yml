name: Project Eclipse validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server/server.js
      - run: node --check client/src/main.js
      - run: node --check server/map-collision.js
      - run: npm test
      - run: npm run build
