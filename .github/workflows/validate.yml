name: Project Eclipse validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/v0.9.0-total-visual-rebuild]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: node --check server/server.js
